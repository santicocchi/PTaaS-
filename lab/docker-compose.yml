# Laboratorio aislado para desarrollo y tests (NO probado en el entorno de generación del kit).
# La red es `internal: true`: sin salida a internet. Los objetivos solo se alcanzan desde el
# contenedor `runner`, donde se monta el proyecto y se corre todo lo que toca el laboratorio.
#
#   docker compose -f lab/docker-compose.yml up -d --build
#   docker compose -f lab/docker-compose.yml exec runner bash
#
# Los alias coinciden con `targets.lab_only_domains` de harness/profiles.yaml.
services:
  dvwa:
    # Imágenes fijadas por digest: lo que se probó es lo que corre (change 004).
    image: vulnerables/web-dvwa@sha256:dae203fe11646a86937bf04db0079adef295f426da68a92b40e3b181f337daa7
    networks:
      lab:
        aliases: [dvwa.lab.test]

  juiceshop:
    image: bkimminich/juice-shop@sha256:877fc77b12d72b42e486eb09b6b1711cc56514306d92006b284e7e7cf076a809
    networks:
      lab:
        aliases: [juiceshop.lab.test]

  runner:
    # python:3.12-alpine + nmap + httpx + subfinder + requirements.txt (ver lab/runner.Dockerfile).
    build:
      context: ..
      dockerfile: lab/runner.Dockerfile
    image: ptaas-runner
    working_dir: /work
    # El runner procesa respuestas de los objetivos, que son datos hostiles. Por eso el código
    # del proyecto se monta de SOLO LECTURA: desde el contenedor no se puede tocar el harness.
    # Lo único escribible es demo/out (bitácoras y grafos de las demos).
    # Corre como root a propósito: con un usuario fijo, demo/out (que es del usuario del host)
    # deja de ser escribible en Linux. El código igual no se puede modificar por el montaje.
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      # Clave de la API de ZAP (change 005). No va al repo: se define en lab/.env (ver README).
      PTAAS_ZAP_API_KEY: ${PTAAS_ZAP_API_KEY:?definí PTAAS_ZAP_API_KEY en lab/.env}
    volumes:
      - ..:/work:ro
      - ../demo/out:/work/demo/out
    command: sleep infinity
    networks:
      lab:
      tools:
        ipv4_address: 10.97.0.10

  zap:
    # ZAP 2.17.0 en modo daemon (change 005, D7). Llega a los objetivos por la red `lab`, pero su
    # API escucha SOLO en la red `tools` y solo acepta llamadas del runner (10.97.0.10) dirigidas
    # a su propia dirección (10.97.0.20).
    # Arranca sin las reglas activas (ascanrules), sin fuzzer, sin fuerza bruta y sin OAST.
    # `-silent`: ZAP no hace pedidos propios (chequeo de versiones, noticias).
    image: zaproxy/zap-stable@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af
    command:
      - zap.sh
      - -daemon
      - -silent
      - -host
      - 10.97.0.20
      - -port
      - "8080"
      - -config
      - api.key=${PTAAS_ZAP_API_KEY:?definí PTAAS_ZAP_API_KEY en lab/.env}
      # ZAP exige que el cliente Y el encabezado Host estén permitidos (defensa contra rebinding).
      - -config
      - api.addrs.addr(0).name=10.97.0.10
      - -config
      - api.addrs.addr(0).regex=false
      - -config
      - api.addrs.addr(1).name=10.97.0.20
      - -config
      - api.addrs.addr(1).regex=false
      - -addonuninstall
      - ascanrules
      - -addonuninstall
      - fuzz
      - -addonuninstall
      - bruteforce
      - -addonuninstall
      - oast
    networks:
      lab:
      tools:
        ipv4_address: 10.97.0.20

networks:
  tools:
    # Red de herramientas (runner ↔ API de ZAP). Fuera de `lab_only_cidrs`: nunca es un objetivo.
    internal: true
    ipam:
      config:
        - subnet: 10.97.0.0/24
  lab:
    internal: true
    # Subred fija y contenida en targets.lab_only_cidrs (harness/profiles.yaml).
    # Si cambia una, cambia la otra: lo verifica tests/test_audit_and_policy.py.
    ipam:
      config:
        - subnet: 10.99.0.0/24
