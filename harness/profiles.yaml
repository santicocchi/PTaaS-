# Perfiles de ejecución de herramientas (solo configuración defensiva y acotada).
# Cambios = delta de spec + revisión del security-reviewer.
# Verificá cada flag contra la versión instalada (`nmap -h`, `nuclei -h`) antes de usar.
version: 1

nmap:
  binary: nmap
  # Detección de servicios sobre puertos frecuentes, ritmo moderado.
  fixed_args: ["-sV", "-T3", "--open", "--top-ports", "100"]
  max_rate_pps: 100
  forbidden_args:        # nunca permitidos, aunque un agente los proponga
    - "--script"
    - "-sC"
    - "-A"
    - "-O"
    - "--script-args"
    - "-iL"
    - "--proxies"
    - "-sU"
  timeout_s: 300
  output: xml

nuclei:
  binary: nuclei
  # Directorio de templates CURADO y revisado: el control principal.
  templates_dir: "templates/allowlist"
  include_tags: ["tech", "exposure", "misconfig", "headers", "panel"]
  exclude_tags: ["intrusive", "dos", "fuzz", "bruteforce", "rce", "sqli", "xss", "oast", "cve", "kev"]
  # Flags de seguridad: sin OAST/Interactsh (sin tráfico a terceros), sin auto-actualización.
  fixed_args: ["-jsonl", "-silent", "-ni", "-duc", "-disable-update-check"]
  rate_limit_rps: 5
  timeout_s: 600
  output: jsonl

targets:
  # En desarrollo solo se permiten estos hosts de laboratorio (red aislada).
  lab_only_domains: ["dvwa.lab.test", "juiceshop.lab.test"]
  lab_only_cidrs: ["10.99.0.0/24"]

subfinder:
  binary: subfinder
  # Pasivo: consulta fuentes públicas, no le manda nada al objetivo. Verificado con subfinder v2.
  fixed_args: ["-silent", "-oJ", "-nc", "-duc", "-timeout", "30", "-max-time", "5"]
  forbidden_args:        # amplían fuentes, lo vuelven activo o meten config/entrada externa
    - "-all"
    - "-recursive"
    - "-nW"
    - "-active"
    - "-oI"
    - "-ip"
    - "-proxy"
    - "-dL"
    - "-list"
    - "-config"
    - "-pc"
    - "-provider-config"
    - "-o"               # escribir archivos queda fuera: la salida va por stdout
    - "-output"
    - "-oD"
    - "-output-dir"
    - "-r"               # resolvers propios
    - "-rL"
  timeout_s: 400
  output: jsonl

httpx:
  binary: httpx
  # Sondeo HTTP liviano contra la IP validada, con el nombre en Host. Verificado con httpx v1.12.0.
  # El rate limit (-rl) sale de policy.yaml (limits.rate_limit_rps_per_target).
  fixed_args: ["-silent", "-j", "-nc", "-duc", "-sc", "-title", "-server", "-td", "-location",
               "-timeout", "10", "-retries", "0"]
  forbidden_args:        # redirecciones (A5), entrada externa, proxy y métodos/cuerpos arbitrarios
    - "-fr"
    - "-follow-redirects"
    - "-fhr"
    - "-follow-host-redirects"
    - "-maxr"
    - "-max-redirects"
    - "-l"
    - "-list"
    - "-proxy"
    - "-http-proxy"
    - "-x"
    - "-body"
    - "-path"
    - "-p"               # puertos extra: el sondeo es sobre el puerto de la URL
    - "-ports"
    - "-csp-probe"       # siguen a dominios del CSP o del certificado, fuera del objetivo
    - "-tls-probe"
    - "-ss"              # capturas con navegador headless
    - "-screenshot"
    - "-config"
    - "-o"
    - "-output"
  timeout_s: 120
  output: jsonl
